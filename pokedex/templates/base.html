{% load static %}
<html>
    <head>
        <title>{% block title %}{% endblock title %}</title>
        <link href="{% static "bootstrap.min.css" %}" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="bg-primary p-5 text-center">
                <img src="{% static "logo.png" %}" alt="Pokemon logo" class="img-fluid">
            </div>
            <nav class="navbar navbar-dark bg-primary">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="{% url "pokedex:index" %}" class="nav-link">Pokemons</a>
                    </li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a href="{% url "logout" %}" class="nav-link">Cerrar sesión</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a href="{% url "pokedex:login" %}" class="nav-link">Iniciar sesión</a>
                        </li>
                    {% endif %}
                </ul>
            </nav>
            {% block content %}{% endblock content %}
        </div>
    </body>
</html>
